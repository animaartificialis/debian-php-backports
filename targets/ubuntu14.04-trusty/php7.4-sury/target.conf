# Target: PHP 7.4 for Ubuntu 14.04 trusty (sourced by bash)
#
# Trusty shipped PHP 5.5; the ondrej/php PPA dropped trusty when its standard support
# ended (2019, before PHP 7.4 was released), so there never was a 7.4 build for it.
# Source is Ondřej Surý's complete php7.4 source package (it contains the
# CVE-2026-109618/109619 fix as debian/patches/0164-...), rebuilt on trusty.
DEBIAN_CODENAME=trusty
DEBIAN_VERSION=14.04
BASE_IMAGE=docker.io/library/ubuntu:14.04
APT_MIRROR=http://archive.ubuntu.com/ubuntu
# trusty-updates instead of trusty-security: Ubuntu publishes security fixes to -updates
# too, and the ubuntu:14.04 image already carries -updates versions.
APT_SECURITY_MIRROR=http://archive.ubuntu.com/ubuntu
APT_SECURITY_SUITE=trusty-updates
APT_COMPONENTS="main universe"
# php7.4 needs php-common (>= 1:81~) to build and to run; trusty has 1:5.5.9. Sury's binary
# php-common declares Breaks on older PECL extension packages, so apt would remove working
# extensions with the upgrade. It is rebuilt from his php-defaults source without that field
# and ships with the packages (pins in build/build.conf, build/container/build-php-common.sh).
REBUILD_PHP_COMMON=1
# Sury's packaging needs debhelper >= 9.20160709 (compat 10) and the php-common rebuild
# needs debhelper >= 10; trusty has 9.20131227 and trusty-backports has no debhelper.
# Install debhelper 10 and its chain from xenial. debhelper and dh-autoreconf depend on
# each other, so the group is unpacked in one dpkg call.
# PHP 7.4 also wants libgcrypt > 1.6.3; trusty has 1.6.1, which is enough for the
# (deprecated) gcrypt extension.
CONTROL_SED="s/libgcrypt20-dev (>> 1.6.3)/libgcrypt20-dev/"
# gcc 4.8 (trusty) does not know -Wincompatible-pointer-types (added in gcc 5); an
# unknown -Wno-error=... is a hard error, so drop the flag.
RULES_SED="s/ -Wno-error=incompatible-pointer-types//"
# trusty's libsasl2-dev and libonig-dev have no pkg-config files; the configure
# checks fall back to these variables when pkg-config cannot find the module.
# (Upgrading to xenial's libsasl2 does not work: its modules-db Breaks the old
# libsasl2-2, so both must be installed in one dpkg call.)
SOURCE_FIXUP_CMD="printf '%s\n' 'export SASL_CFLAGS = -I/usr/include' 'export SASL_LIBS = -lsasl2' 'export ONIG_CFLAGS = -I/usr/include' 'export ONIG_LIBS = -lonig' >> debian/rules"
# trusty's libpcre3-dev is too old for bionic's libpcre2-dev; purge it (with the
# libglib2.0-dev that depends on it) before the xenial pcre3 chain is installed.
PURGE_PACKAGES="libpcre3-dev"
# Extra .deb files installed for the build and shipped with the packages:
# - bionic's libargon2-0 (trusty has no argon2 at all),
# - xenial's libpcre3 8.38: bionic's libpcre2-dev conflicts with libpcre3-dev
#   (<< 2:8.35-8), and trusty has 1:8.31. Its C++ bindings need libstdc++ 5.2,
#   so xenial's libstdc++6 comes along. The pcre3 chain comes from xenial,
# - bionic's libpcre2 10.31 (PHP 7.4 needs >= 10.30; trusty has no pcre2),
# - bionic's libtidy5 5.2.0 (Sury needs >= 5.2.0, trusty has the 2009 libtidy-0.99),
# - xenial's libzip4 1.0.1 (PHP 7.4 needs >= 0.11 without the bundled copy; trusty has 0.10.1),
# - trusty's libgcrypt20 runtime: xenial's libsystemd0 pre-depends on it,
# - xenial's libsystemd0 and libsystemd-dev (trusty predates libsystemd0; php-fpm
#   builds with systemd notify), plus trusty's dh-systemd for the debhelper addon,
# - trusty's apr dev packages, so that the xenial apache2-dev below installs cleanly,
# - xenial's apache2-dev 2.4.18, which Provides dh-apache2 (trusty's 2.4.7 does not).
# Their shared libraries need at most GLIBC_2.17 (trusty has 2.19).
# Libraries before -dev packages; apache2-dev last because it replaces trusty's.
BIONIC_POOL=http://archive.ubuntu.com/ubuntu/pool
XENIAL_POOL=http://archive.ubuntu.com/ubuntu/pool
TRUSTY_POOL=http://archive.ubuntu.com/ubuntu/pool
EXTRA_DEB_GROUP_URLS="${XENIAL_POOL}/main/d/dpkg/dpkg_1.18.4ubuntu1_amd64.deb
 ${XENIAL_POOL}/main/d/dpkg/libdpkg-perl_1.18.4ubuntu1_all.deb
 ${XENIAL_POOL}/main/d/dpkg/dpkg-dev_1.18.4ubuntu1_all.deb
 ${XENIAL_POOL}/main/g/gettext/autopoint_0.19.7-2ubuntu3_all.deb
 ${XENIAL_POOL}/main/s/strip-nondeterminism/libfile-stripnondeterminism-perl_0.015-1_all.deb
 ${XENIAL_POOL}/main/s/strip-nondeterminism/dh-strip-nondeterminism_0.015-1_all.deb
 ${XENIAL_POOL}/main/d/debhelper/debhelper_10.2.2ubuntu1~ubuntu16.04.1_all.deb
 ${XENIAL_POOL}/main/d/dh-autoreconf/dh-autoreconf_12~ubuntu16.04.1_all.deb"
EXTRA_DEB_URLS="${BIONIC_POOL}/main/a/argon2/libargon2-0_0~20161029-1.1_amd64.deb
 ${BIONIC_POOL}/main/a/argon2/libargon2-0-dev_0~20161029-1.1_amd64.deb
 ${XENIAL_POOL}/main/g/gcc-5/gcc-5-base_5.3.1-14ubuntu2_amd64.deb
 ${XENIAL_POOL}/main/g/gcc-5/libstdc++6_5.3.1-14ubuntu2_amd64.deb
 ${XENIAL_POOL}/main/p/pcre3/libpcre3_8.38-3.1_amd64.deb
 ${XENIAL_POOL}/main/p/pcre3/libpcre16-3_8.38-3.1_amd64.deb
 ${XENIAL_POOL}/main/p/pcre3/libpcre32-3_8.38-3.1_amd64.deb
 ${XENIAL_POOL}/main/p/pcre3/libpcrecpp0v5_8.38-3.1_amd64.deb
 ${XENIAL_POOL}/main/p/pcre3/libpcre3-dev_8.38-3.1_amd64.deb
 ${BIONIC_POOL}/universe/p/pcre2/libpcre2-8-0_10.31-2_amd64.deb
 ${BIONIC_POOL}/universe/p/pcre2/libpcre2-16-0_10.31-2_amd64.deb
 ${BIONIC_POOL}/universe/p/pcre2/libpcre2-32-0_10.31-2_amd64.deb
 ${BIONIC_POOL}/universe/p/pcre2/libpcre2-posix0_10.31-2_amd64.deb
 ${BIONIC_POOL}/universe/p/pcre2/libpcre2-dev_10.31-2_amd64.deb
 ${BIONIC_POOL}/main/t/tidy-html5/libtidy5_5.2.0-2_amd64.deb
 ${BIONIC_POOL}/main/t/tidy-html5/libtidy-dev_5.2.0-2_amd64.deb
 ${XENIAL_POOL}/universe/libz/libzip/libzip4_1.0.1-0ubuntu1_amd64.deb
 ${XENIAL_POOL}/universe/libz/libzip/libzip-dev_1.0.1-0ubuntu1_amd64.deb
 ${TRUSTY_POOL}/universe/libg/libgcrypt20/libgcrypt20_1.6.1-2ubuntu1.14.04.1_amd64.deb
 ${XENIAL_POOL}/main/s/systemd/libsystemd0_229-4ubuntu4_amd64.deb
 ${XENIAL_POOL}/main/s/systemd/libsystemd-dev_229-4ubuntu4_amd64.deb
 ${TRUSTY_POOL}/main/i/init-system-helpers/dh-systemd_1.14ubuntu1_all.deb
 ${TRUSTY_POOL}/main/a/apr/libapr1-dev_1.5.0-1_amd64.deb
 ${TRUSTY_POOL}/main/a/apr-util/libaprutil1-dev_1.5.3-1_amd64.deb
 ${XENIAL_POOL}/main/a/apache2/apache2-dev_2.4.18-2ubuntu3_amd64.deb"
# Sury's DNS telemetry patch is not wanted in our rebuilds.
DROP_PATCHES="0128-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch"
SOURCE_PACKAGE=php7.4
SOURCE_VERSION=7.4.33-31+0~20261021.121+debian11~1.gbpe9c428
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php7.4
SOURCE_DSC_SHA256=6b7c27a939284fc6e21f8678cf2dcacdc3c90c341b365ab97168474d70a9c4ec
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Trusty never had PHP 7.4, so there is no previous build to sort above.
NEW_VERSION="1:7.4.33-31+0~20261021.121+ubuntu14.04~1+animaa1"
SURY_SOURCE_PACKAGE=php7.4
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php7.4 7.4.33-31 for Ubuntu 14.04 trusty (includes the fix for CVE-2026-109618 and CVE-2026-109619; system PCRE2 10.31, argon2, tidy 5.2, libzip 1.0 and libsystemd from newer Ubuntu releases; php-common rebuilt from deb.sury.org php-defaults without its Breaks on PECL packages)."
TEST_PACKAGES="php7.4-cli php7.4-fpm"
# Stand-ins for extension packages a server has from Sury's old repository (versions
# in its style): below the limits in Sury's php-common Breaks, they must survive the upgrade.
TEST_DUMMY_PACKAGES="php-apcu=5.1.16+4.0.10-1+ubuntu14.04.1+deb.sury.org+1 php-imagick=3.4.4-1+ubuntu14.04.1+deb.sury.org+1"
TEST_PHP_BINARY=php7.4
