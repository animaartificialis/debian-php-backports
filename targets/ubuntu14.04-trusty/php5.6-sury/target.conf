# Target: PHP 5.6 for Ubuntu 14.04 trusty (sourced by bash)
#
# Trusty shipped PHP 5.5; PHP 5.6 came from the ondrej/php PPA, which dropped trusty
# when its standard support ended (2019). Source is Ondřej Surý's complete php5.6 source
# package (it contains the CVE-2026-109618/109619 fix as debian/patches/0261-... and
# the CVE-2023-0662 backport), rebuilt on trusty.
DEBIAN_CODENAME=trusty
DEBIAN_VERSION=14.04
BASE_IMAGE=docker.io/library/ubuntu:14.04
APT_MIRROR=http://archive.ubuntu.com/ubuntu
# trusty-updates instead of trusty-security: Ubuntu publishes security fixes to -updates
# too, and the ubuntu:14.04 image already carries -updates versions.
APT_SECURITY_MIRROR=http://archive.ubuntu.com/ubuntu
APT_SECURITY_SUITE=trusty-updates
APT_COMPONENTS="main universe"
# php5.6 needs php-common (>= 1:81~) to build and to run; trusty has 1:5.5.9. Sury's binary
# php-common declares Breaks on older PECL extension packages, so apt would remove working
# extensions with the upgrade. It is rebuilt from his php-defaults source without that field
# and ships with the packages (pins in build/build.conf, build/container/build-php-common.sh).
REBUILD_PHP_COMMON=1
# Sury's packaging needs debhelper >= 9.20160709 (compat 10); trusty has 9.20131227 and no
# newer one in backports. Build at compat 9, as the php7.4 target does.
# PCRE: Sury asks for libpcre3 >= 2:8.35 (xenial's epoch); trusty has 1:8.31, which PHP 5.6
# builds and runs with (trusty's own PHP 5.5 uses it). Shipping a newer libpcre3 would
# replace a core trusty package, so build against trusty's.
# systemd: trusty predates libsystemd; PHP 5.6 also finds sd_notify in trusty's own
# libsystemd-daemon, so php5.6-fpm needs no libsystemd0 from xenial.
# debian/control is generated from control.in during the build: same changes there.
CONTROL_SED="s/debhelper (>= 9.20160709~)/debhelper (>= 9.20131227~)/; s/libpcre3-dev (>= 2:8.35)/libpcre3-dev/; s/libpcre3 (>= 2:8.35)/libpcre3/; s/libsystemd-dev/libsystemd-daemon-dev/"
# gcc 4.8 (trusty) does not know -Wincompatible-pointer-types (added in gcc 5); an
# unknown -Wno-error=... is a hard error, so drop the flag.
RULES_SED="s/ -Wno-error=incompatible-pointer-types//"
SOURCE_FIXUP_CMD='echo 9 > debian/compat && sed -i -e "$CONTROL_SED" debian/control.in'
# Extra .deb files installed for the build. Shipped with the packages, because the built
# packages need them at run time and trusty does not have them:
# - bionic's libtidy5 5.2.0 (Sury needs >= 5.2.0, trusty has the 2009 libtidy-0.99),
# - xenial's libzip4 1.0.1 (Sury needs >= 1.0.0; trusty has 0.10.1).
# Only for the build (EXTRA_DEB_BUILD_ONLY below): their -dev packages and trusty's
# dh-systemd (the packaging uses dh --with systemd). Targets of the same release share
# the apt pool (repo/build-apt-repo.sh copies with cp -n): they must mark the same names.
BIONIC_POOL=http://archive.ubuntu.com/ubuntu/pool
XENIAL_POOL=http://archive.ubuntu.com/ubuntu/pool
TRUSTY_POOL=http://archive.ubuntu.com/ubuntu/pool
EXTRA_DEB_URLS="${BIONIC_POOL}/main/t/tidy-html5/libtidy5_5.2.0-2_amd64.deb
 ${BIONIC_POOL}/main/t/tidy-html5/libtidy-dev_5.2.0-2_amd64.deb
 ${XENIAL_POOL}/universe/libz/libzip/libzip4_1.0.1-0ubuntu1_amd64.deb
 ${XENIAL_POOL}/universe/libz/libzip/libzip-dev_1.0.1-0ubuntu1_amd64.deb
 ${TRUSTY_POOL}/main/i/init-system-helpers/dh-systemd_1.14ubuntu1_all.deb"
EXTRA_DEB_BUILD_ONLY="libtidy-dev libzip-dev dh-systemd"
# Sury's DNS telemetry patch is not wanted in our rebuilds.
DROP_PATCHES="0251-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch"
SOURCE_PACKAGE=php5.6
SOURCE_VERSION=5.6.40-105+0~20261022.135+debian12~1.gbp37a17e
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php5.6
SOURCE_DSC_SHA256=d68b4e2a9fa6427768ac043d25ac48f6bb72bcb26e66c8c99dece1b98d364de8
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above the PPA's last trusty builds (5.6.40-N+ubuntu14.04.1+deb.sury.org+1).
NEW_VERSION="5.6.40-105+0~20261022.135+ubuntu14.04~1+animaa1"
SURY_SOURCE_PACKAGE=php5.6
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php5.6 5.6.40-105 for Ubuntu 14.04 trusty (includes the fixes for CVE-2026-109618, CVE-2026-109619 and CVE-2023-0662; trusty's PCRE 8.31 and libsystemd-daemon; tidy 5.2 from bionic and libzip 1.0 from xenial; php-common rebuilt from deb.sury.org php-defaults without its Breaks on PECL packages)."
TEST_PACKAGES="php5.6-cli php5.6-fpm"
# Stand-ins for extension packages a server has from Sury's old repository (versions
# in its style): below the limits in Sury's php-common Breaks, they must survive the upgrade.
TEST_DUMMY_PACKAGES="php-apcu=5.1.16+4.0.10-1+ubuntu14.04.1+deb.sury.org+1 php-imagick=3.4.4-1+ubuntu14.04.1+deb.sury.org+1"
TEST_PHP_BINARY=php5.6
