# Target: PHP 5.6 for Debian 10 buster (sourced by bash)
#
# Buster never shipped PHP 5.6; it came from deb.sury.org, which dropped buster.
# Source is Ondřej Surý's complete php5.6 source package (it contains the
# CVE-2026-109618/109619 fix as debian/patches/0261-...), rebuilt on buster.
DEBIAN_CODENAME=buster
DEBIAN_VERSION=10
BASE_IMAGE=docker.io/library/debian:buster-slim
# Architectures to build, natively on a runner of each (the base image is multi-arch).
ARCHES="amd64 arm64"
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian-security
APT_SECURITY_SUITE=buster/updates
# Buster's own php-common (2:69) is new enough; nothing extra is shipped.
# Sury's DNS telemetry patch is not wanted in our rebuilds.
DROP_PATCHES="0251-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch"
SOURCE_PACKAGE=php5.6
SOURCE_VERSION=5.6.40-105+0~20261022.135+debian12~1.gbp37a17e
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php5.6
SOURCE_DSC_SHA256=d68b4e2a9fa6427768ac043d25ac48f6bb72bcb26e66c8c99dece1b98d364de8
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above Sury's last buster builds (5.6.40-N+0~...+debian10~1.gbp...).
NEW_VERSION="5.6.40-105+0~20261022.135+debian10~1+animaa1"
SURY_SOURCE_PACKAGE=php5.6
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php5.6 5.6.40-105 for Debian 10 buster (includes the fixes for CVE-2026-109618, CVE-2026-109619 and CVE-2023-0662)."
TEST_PACKAGES="php5.6-cli php5.6-fpm"
TEST_PHP_BINARY=php5.6
