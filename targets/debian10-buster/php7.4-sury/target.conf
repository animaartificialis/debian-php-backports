# Target: PHP 7.4 for Debian 10 buster (sourced by bash)
#
# Buster never shipped PHP 7.4; it came from deb.sury.org, which dropped buster.
# Source is therefore Ondřej Surý's complete php7.4 source package (it already
# contains the CVE-2026-109618/109619 fix as debian/patches/0164-...), rebuilt
# on buster. No extra patches are added.
DEBIAN_CODENAME=buster
DEBIAN_VERSION=10
BASE_IMAGE=docker.io/library/debian:buster-slim
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian-security
APT_SECURITY_SUITE=buster/updates
SOURCE_PACKAGE=php7.4
# Version as used in the file names (the package version itself has epoch 1:)
SOURCE_VERSION=7.4.33-31+0~20261021.121+debian11~1.gbpe9c428
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php7.4
SOURCE_DSC_SHA256=6b7c27a939284fc6e21f8678cf2dcacdc3c90c341b365ab97168474d70a9c4ec
# php7.4 is not in the buster archive, so build dependencies come from the dsc.
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above Sury's last buster builds (1:7.4.33-N+0~...+debian10~1.gbp...).
NEW_VERSION="1:7.4.33-31+0~20261021.121+debian10~1+animaa1"
SURY_SOURCE_PACKAGE=php7.4
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php7.4 7.4.33-31 for Debian 10 buster (includes the fix for CVE-2026-109618 and CVE-2026-109619)."
# Packages installed by tests/install (no stock php7.4 on buster: negative case is skipped)
TEST_PACKAGES="php7.4-cli php7.4-fpm"
TEST_PHP_BINARY=php7.4
