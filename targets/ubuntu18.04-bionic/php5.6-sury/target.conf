# Target: PHP 5.6 for Ubuntu 18.04 bionic (sourced by bash)
#
# Bionic never shipped PHP 5.6 (it has 7.2); newer builds came from the ondrej/php PPA, which
# dropped bionic when its standard support ended (last build 5.6.40-66, 2023-06).
# Source is Ondřej Surý's complete php5.6 source package (it contains the
# CVE-2026-109618/109619 fix as debian/patches/0261-...), rebuilt on bionic.
DEBIAN_CODENAME=bionic
DEBIAN_VERSION=18.04
BASE_IMAGE=docker.io/library/ubuntu:18.04
APT_MIRROR=http://archive.ubuntu.com/ubuntu
# bionic-updates instead of bionic-security: Ubuntu publishes security fixes to -updates
# too, and the ubuntu:18.04 image already carries -updates versions that the
# security pocket alone cannot satisfy build dependencies against.
APT_SECURITY_MIRROR=http://archive.ubuntu.com/ubuntu
APT_SECURITY_SUITE=bionic-updates
APT_COMPONENTS="main universe"
# php5.6-common needs a newer php-common than bionic's 1:60ubuntu1: ship Sury's.
EXTRA_DEB_URLS="https://packages.sury.org/php/pool/main/p/php-defaults/php-common_101%2B0~20261021.78%2Bdebian11~1.gbp53f25f_all.deb"
# Sury's DNS telemetry patch is not wanted in our rebuilds.
DROP_PATCHES="0251-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch"
SOURCE_PACKAGE=php5.6
SOURCE_VERSION=5.6.40-105+0~20261022.135+debian12~1.gbp37a17e
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php5.6
SOURCE_DSC_SHA256=d68b4e2a9fa6427768ac043d25ac48f6bb72bcb26e66c8c99dece1b98d364de8
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above the PPA's last bionic build 5.6.40-66+ubuntu18.04.1+deb.sury.org+1.
NEW_VERSION="5.6.40-105+0~20261022.135+ubuntu18.04~1+animaa1"
SURY_SOURCE_PACKAGE=php5.6
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php5.6 5.6.40-105 for Ubuntu 18.04 bionic (includes the fixes for CVE-2026-109618, CVE-2026-109619 and CVE-2023-0662)."
TEST_PACKAGES="php5.6-cli php5.6-fpm"
TEST_PHP_BINARY=php5.6
