# Target: PHP 7.2 for Ubuntu 18.04 bionic (sourced by bash)
#
# Bionic shipped PHP 7.2.24 (still patched by Canonical through Ubuntu Pro); newer builds came from the ondrej/php PPA, which
# dropped bionic when its standard support ended (last build 7.2.34-39, 2023-06).
# Source is Ondřej Surý's complete php7.2 source package (it contains the
# CVE-2026-109618/109619 fix as debian/patches/0159-...), rebuilt on bionic.
DEBIAN_CODENAME=bionic
DEBIAN_VERSION=18.04
BASE_IMAGE=docker.io/library/ubuntu:18.04
APT_MIRROR=http://archive.ubuntu.com/ubuntu
# bionic-updates instead of bionic-security: Ubuntu publishes security fixes to -updates
# too, and the ubuntu:18.04 image already carries -updates versions that the
# security pocket alone cannot satisfy build dependencies against.
APT_SECURITY_MIRROR=http://archive.ubuntu.com/ubuntu
APT_SECURITY_SUITE=bionic-updates
APT_COMPONENTS="main universe"
# php7.2-common needs a newer php-common than bionic's 1:60ubuntu1: ship Sury's.
# Bionic's own argon2 is recent enough; PHP 7.2 uses PCRE1.
EXTRA_DEB_URLS="https://packages.sury.org/php/pool/main/p/php-defaults/php-common_101%2B0~20261021.78%2Bdebian11~1.gbp53f25f_all.deb"
# Sury's DNS telemetry patch is not wanted in our rebuilds.
DROP_PATCHES="0144-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch"
SOURCE_PACKAGE=php7.2
SOURCE_VERSION=7.2.34-66+0~20261021.122+debian12~1.gbpe0bcd4
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php7.2
SOURCE_DSC_SHA256=700179ad3e7959ae313129bbadb535970cc3e3698a6b96c68d37ece266e27068
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above bionic's 7.2.24-0ubuntu0.18.04.N and the PPA's last 7.2.34-39+ubuntu18.04.1+deb.sury.org+1.
NEW_VERSION="7.2.34-66+0~20261021.122+ubuntu18.04~1+animaa1"
SURY_SOURCE_PACKAGE=php7.2
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php7.2 7.2.34-66 for Ubuntu 18.04 bionic (includes the fix for CVE-2026-109618 and CVE-2026-109619)."
TEST_PACKAGES="php7.2-cli php7.2-fpm"
TEST_PHP_BINARY=php7.2
