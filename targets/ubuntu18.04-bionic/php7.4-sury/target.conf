# Target: PHP 7.4 for Ubuntu 18.04 bionic (sourced by bash)
#
# Bionic never shipped PHP 7.4; newer builds came from the ondrej/php PPA, which
# dropped bionic when its standard support ended (last build 1:7.4.33-6, 2023-06).
# Source is Ondřej Surý's complete php7.4 source package (it contains the
# CVE-2026-109618/109619 fix as debian/patches/0164-...), rebuilt on bionic.
DEBIAN_CODENAME=bionic
DEBIAN_VERSION=18.04
BASE_IMAGE=docker.io/library/ubuntu:18.04
APT_MIRROR=http://archive.ubuntu.com/ubuntu
# bionic-updates instead of bionic-security: Ubuntu publishes security fixes to -updates
# too, and the ubuntu:18.04 image already carries -updates versions that the
# security pocket alone cannot satisfy build dependencies against.
APT_SECURITY_MIRROR=http://archive.ubuntu.com/ubuntu
APT_SECURITY_SUITE=bionic-updates
APT_COMPONENTS="main universe"
# php7.4 needs php-common (>= 1:81~) to build and to run; bionic has 1:60ubuntu1. Sury's binary
# php-common breaks older PECL extension packages (php-apcu, php-imagick, php-redis, ...:
# limits meant for PHP 8), so apt would remove working extensions with the upgrade. It is
# rebuilt from his php-defaults source without that field and ships with the packages
# (pins in build/build.conf, build/container/build-php-common.sh).
REBUILD_PHP_COMMON=1
# Bionic's own argon2 and PCRE2 (10.31) are recent enough.
# Sury's DNS telemetry patch is not wanted in our rebuilds.
DROP_PATCHES="0128-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch"
SOURCE_PACKAGE=php7.4
SOURCE_VERSION=7.4.33-31+0~20261021.121+debian11~1.gbpe9c428
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php7.4
SOURCE_DSC_SHA256=6b7c27a939284fc6e21f8678cf2dcacdc3c90c341b365ab97168474d70a9c4ec
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above the PPA's last bionic build 1:7.4.33-6+ubuntu18.04.1+deb.sury.org+1.
NEW_VERSION="1:7.4.33-31+0~20261021.121+ubuntu18.04~1+animaa2"
SURY_SOURCE_PACKAGE=php7.4
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php7.4 7.4.33-31 for Ubuntu 18.04 bionic (includes the fix for CVE-2026-109618 and CVE-2026-109619; php-common rebuilt from deb.sury.org php-defaults without its Breaks on PECL packages)."
TEST_PACKAGES="php7.4-cli php7.4-fpm"
# Stand-ins for extension packages a server has from Sury's old repository (versions
# in its style): below the limits in Sury's php-common Breaks, they must survive the upgrade.
TEST_DUMMY_PACKAGES="php-apcu=5.1.17+4.0.11-1+ubuntu18.04.1+deb.sury.org+1 php-imagick=3.4.4-1+ubuntu18.04.1+deb.sury.org+1"
TEST_PHP_BINARY=php7.4
