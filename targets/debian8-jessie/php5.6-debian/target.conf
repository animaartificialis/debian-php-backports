# Target: Debian 8 jessie (sourced by bash)
# DRAFT: not validated yet; values will be verified in a dedicated iteration.
# Note: jessie's Debian source package is php5 (5.6.40+dfsg) while Sury's is php5.6,
# so the Sury patch may need adjusting (different patch stack / paths).
DEBIAN_CODENAME=jessie
DEBIAN_VERSION=8
BASE_IMAGE=docker.io/library/debian:jessie-slim
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian-security
APT_SECURITY_SUITE=jessie/updates
# jessie's apt 1.0 refuses packages signed by the expired jessie keys; the archive
# is treated as trusted (no stronger verification is possible for jessie anymore).
APT_SOURCE_OPTIONS="[trusted=yes]"
SOURCE_PACKAGE=php5
SOURCE_VERSION=5.6.40+dfsg-0+deb8u12
SOURCE_POOL_URL=http://archive.debian.org/debian-security/pool/updates/main/p/php5
SOURCE_DSC_SHA256=57771203be7b7f8485bcf4e134e2ffffcd93574780d3f9c68a49b79a73c4382e
SURY_SOURCE_PACKAGE=php5.6
SURY_DEBIAN_TAR_URL="https://packages.sury.org/php/pool/main/p/php5.6/php5.6_5.6.40-104%2B0~20261021.134%2Bdebian12~1.gbp7401dd.debian.tar.xz"
SURY_DEBIAN_TAR_SHA256=0644457300f58a8042df227fc74cd6a8b72dfc03e2d674c54f082cbc25dd9aff
# Unknown: whether the php5.6 patch applies to the php5 (5.6.40+dfsg) tree without changes.
SURY_PATCHES="0261-Avoid-state-corruption-via-bailout.patch"
CHANGELOG_ENTRY="Backport fix for CVE-2026-109618 and CVE-2026-109619 (Avoid state corruption via bailout) from deb.sury.org php5.6 5.6.40-104."
# Packages installed by tests/install
TEST_PACKAGES="php5-cli php5-fpm"
TEST_PHP_BINARY=php5
