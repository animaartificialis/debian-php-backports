# Target: Debian 8 jessie (sourced by bash)
# jessie's Debian source package is php5 (5.6.40+dfsg). The source is the last Freexian
# ELTS update of it (deb8u23, April 2025), which has the ELTS fixes from deb8u13 to
# deb8u23 on top of Debian LTS's last update (deb8u12). The newer fixes come from Sury's
# php5.6 patch stack; 0257, 0260 and 0395 are regenerated (see patches/SOURCE.md), and
# 0401 is our own 5.6 port of an upstream fix. Do not run build/fetch-sury-patches.sh for
# this target: it would replace or remove those files and rewrite SOURCE.md.
DEBIAN_CODENAME=jessie
DEBIAN_VERSION=8
BASE_IMAGE=docker.io/library/debian:jessie-slim
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian-security
APT_SECURITY_SUITE=jessie/updates
# jessie's apt 1.0 refuses packages signed by the expired jessie keys; the archive
# is treated as trusted (no stronger verification is possible for jessie anymore).
APT_SOURCE_OPTIONS="[trusted=yes]"
SOURCE_PACKAGE=php5
# Freexian's public ELTS repository; same orig tarball and Build-Depends as Debian's deb8u12
SOURCE_VERSION=5.6.40+dfsg-0+deb8u23
SOURCE_POOL_URL=http://deb.freexian.com/extended-lts/pool/main/p/php5
SOURCE_DSC_SHA256=eb6eb6eeacc96f2c994a58f38521e80e944efdfc46099980687f83e28cf06612
SURY_SOURCE_PACKAGE=php5.6
SURY_DEBIAN_TAR_URL="https://packages.sury.org/php/pool/main/p/php5.6/php5.6_5.6.40-105%2B0~20261022.135%2Bdebian12~1.gbp37a17e.debian.tar.xz"
SURY_DEBIAN_TAR_SHA256=9b87b75b08921b559888381ad0cc9a7be64f67c3e246413dd1f0327c2651afff
# 0253: CVE-2026-7261, 0254: CVE-2026-7262, 0257: CVE-2026-6735, 0260: GH-22187,
# 0261: CVE-2026-109618/109619. Sury's 0262 + 0263 (CVE-2023-0662) are not needed:
# ELTS deb8u17 already has that fix (debian/patches/CVE-2023-0662.patch).
# 0390-0400 (the PHP 8.2.36 fixes of November 2026) come from a newer Sury tarball,
# php5.6 5.6.40-109 (sha256 in patches/SOURCE.md), where the older patches above have
# other numbers; that is why they are not in SURY_PATCHES.
SURY_PATCHES="0253-GHSA-m33r-qmcv-p97q-soap-Fix-use-after-free-after-he.patch 0254-GHSA-hmxp-6pc4-f3vv-soap-Fix-broken-Apache-map-value.patch 0257-GHSA-7qg2-v9fj-4mwv-fpm-XSS-within-status-endpoint.patch 0260-ext-openssl-openssl_encrypt-zend-mm-heap-overflow-on.patch 0261-Avoid-state-corruption-via-bailout.patch"
# Must sort above the earlier builds here (5.6.40+dfsg-0+deb8u23+animaa1) and above
# ELTS's own 5.6.40+dfsg-0+deb8u23, so that apt picks this build when both are enabled.
NEW_VERSION="5.6.40+dfsg-0+deb8u23+animaa2"
CHANGELOG_ENTRY="CVE-2026-129289, CVE-2026-129291, CVE-2026-115560, CVE-2026-126714, CVE-2026-128090, CVE-2026-15353, CVE-2026-129292, CVE-2026-129506, CVE-2026-128064, CVE-2026-129496, CVE-2026-129538, CVE-2026-6735, CVE-2026-7261, CVE-2026-109619, CVE-2026-127960, CVE-2026-109618, CVE-2026-7262 and GH-22187: fixes added to Freexian ELTS php5 5.6.40+dfsg-0+deb8u23. From deb.sury.org php5.6 5.6.40-109, the PHP 8.2.36 fixes for CGI PATH_INFO, the timezone cache, FPM request smuggling, the FPM status page, FPM epoll, Phar signatures, session files, session upload progress, SOAP arrays, SOAP DTDs and mixed-case HTTPS and FTPS URLs. Ported here from PHP 8.2.36: folded HTTP response headers (CVE-2026-127960). From 5.6.40-105: Avoid state corruption via bailout, SOAP, FPM status page XSS and openssl_encrypt() heap overflow with AES-WRAP-PAD."
# Packages installed by tests/install
TEST_PACKAGES="php5-cli php5-fpm"
TEST_PHP_BINARY=php5
