# Target: Debian 8 jessie (sourced by bash)
# jessie's Debian source package is php5 (5.6.40+dfsg); the fixes come from Sury's php5.6
# patch stack and apply to it unchanged.
DEBIAN_CODENAME=jessie
DEBIAN_VERSION=8
BASE_IMAGE=docker.io/library/debian:jessie-slim
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian-security
APT_SECURITY_SUITE=jessie/updates
# jessie's apt 1.0 refuses packages signed by the expired jessie keys; the archive
# is treated as trusted (no stronger verification is possible for jessie anymore).
APT_SOURCE_OPTIONS="[trusted=yes]"
SOURCE_PACKAGE=php5
SOURCE_VERSION=5.6.40+dfsg-0+deb8u12
SOURCE_POOL_URL=http://archive.debian.org/debian-security/pool/updates/main/p/php5
SOURCE_DSC_SHA256=57771203be7b7f8485bcf4e134e2ffffcd93574780d3f9c68a49b79a73c4382e
SURY_SOURCE_PACKAGE=php5.6
SURY_DEBIAN_TAR_URL="https://packages.sury.org/php/pool/main/p/php5.6/php5.6_5.6.40-105%2B0~20261022.135%2Bdebian12~1.gbp37a17e.debian.tar.xz"
SURY_DEBIAN_TAR_SHA256=9b87b75b08921b559888381ad0cc9a7be64f67c3e246413dd1f0327c2651afff
# 0261: CVE-2026-109618/109619. 0262 + 0263: CVE-2023-0662 (max_multipart_body_parts),
# which Debian's last jessie update (deb8u12) predates.
SURY_PATCHES="0261-Avoid-state-corruption-via-bailout.patch 0262-Fix-repeated-warning-for-file-uploads-limit-exceedin.patch 0263-Introduce-max_multipart_body_parts-INI.patch"
# animaa2: second build of deb8u12 (adds CVE-2023-0662); must sort above +animaa1.
NEW_VERSION="5.6.40+dfsg-0+deb8u12+animaa2"
CHANGELOG_ENTRY="Backport fixes from deb.sury.org php5.6 5.6.40-105: CVE-2026-109618 and CVE-2026-109619 (Avoid state corruption via bailout), CVE-2023-0662 (max_multipart_body_parts)."
# Packages installed by tests/install
TEST_PACKAGES="php5-cli php5-fpm"
TEST_PHP_BINARY=php5
