# Target: PHP 5.6 for Debian 8 jessie (sourced by bash)
#
# Jessie never shipped PHP 5.6; it came from deb.sury.org, which dropped jessie.
# Source is Ondřej Surý's complete php5.6 source package (it contains the
# CVE-2026-109618/109619 fix as debian/patches/0251-...), rebuilt on jessie.
DEBIAN_CODENAME=jessie
DEBIAN_VERSION=8
BASE_IMAGE=docker.io/library/debian:jessie-slim
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian-security
APT_SECURITY_SUITE=jessie/updates
# jessie's apt 1.0 refuses packages signed by the expired jessie keys.
APT_SOURCE_OPTIONS="[trusted=yes]"
# libc-client-dev (imap) is non-free
APT_COMPONENTS="main non-free"
# debian/compat 10 needs debhelper >= 10 (jessie has 9): take it from backports
APT_BACKPORTS_SUITE=jessie-backports
BACKPORTS_PACKAGES="debhelper"
# php5.6-common depends on php-common (>= 1:81~): ship Sury's php-common with the build
EXTRA_DEB_URLS="https://packages.sury.org/php/pool/main/p/php-defaults/php-common_101%2B0~20261021.78%2Bdebian11~1.gbp53f25f_all.deb"
# PHP 5.6 upstream supports libzip >= 0.11 and the legacy libtidy, both in jessie;
# Sury's minimums reflect newer distributions only.
CONTROL_SED="s/libzip-dev (>= 1.0.0)/libzip-dev/; s/libtidy-dev (>= 1:5.2.0)/libtidy-dev/"
# gcc 4.9 (jessie) does not know -Wincompatible-pointer-types (added in gcc 5).
RULES_SED="s/ -Wno-error=incompatible-pointer-types//"
# Sury's DNS telemetry patch (telemetry.sury.org) needs libsodium >= 1.0.12 (jessie
# has 1.0.0) and is not wanted in our rebuilds anyway: leave it out of the series.
# 0053 switches ext/tidy to tidy-html5 headers (tidybuffio.h); jessie has the legacy
# libtidy with buffio.h, which upstream 5.6 code uses.
DROP_PATCHES="0053-Adjust-tidy-extension-for-tidy-html5.patch 0251-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch"
SOURCE_PACKAGE=php5.6
SOURCE_VERSION=5.6.40-104+0~20261021.134+debian12~1.gbp7401dd
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php5.6
SOURCE_DSC_SHA256=6bfab76939973d2bc8baa8144ac497e61c51c5c815db1860c64af98b7a6e6d78
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above Sury's last jessie builds (5.6.40-N+0~...+debian8~1.gbp...).
NEW_VERSION="5.6.40-104+0~20261021.134+debian8~1+animaa1"
SURY_SOURCE_PACKAGE=php5.6
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php5.6 5.6.40-104 for Debian 8 jessie (includes the fix for CVE-2026-109618 and CVE-2026-109619; libzip/libtidy build-deps relaxed to jessie versions)."
# Packages installed by tests/install (no stock php5.6 on jessie: negative case is skipped)
TEST_PACKAGES="php5.6-cli php5.6-fpm"
TEST_PHP_BINARY=php5.6
