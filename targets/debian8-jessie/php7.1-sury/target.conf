# Target: PHP 7.1 for Debian 8 jessie (sourced by bash)
#
# Jessie never shipped PHP 7.1; it came from deb.sury.org, which dropped jessie.
# Source is Ondřej Surý's complete php7.1 source package (it contains the
# CVE-2026-109618/109619 fix as debian/patches/0186-...), rebuilt on jessie.
DEBIAN_CODENAME=jessie
DEBIAN_VERSION=8
BASE_IMAGE=docker.io/library/debian:jessie-slim
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian-security
APT_SECURITY_SUITE=jessie/updates
# jessie's apt 1.0 refuses packages signed by the expired jessie keys.
APT_SOURCE_OPTIONS="[trusted=yes]"
# libc-client-dev (imap) is non-free
APT_COMPONENTS="main non-free"
# debian/compat 10 needs debhelper >= 10 (jessie has 9): take it from backports
APT_BACKPORTS_SUITE=jessie-backports
BACKPORTS_PACKAGES="debhelper"
# php7.1 needs php-common (>= 1:81~) to build and to run; jessie has none. Sury's binary
# php-common breaks older PECL extension packages (php-apcu, php-imagick, php-redis, ...:
# limits meant for PHP 8), so apt would remove working extensions with the upgrade. It is
# rebuilt from his php-defaults source without that field and ships with the packages
# (pins in build/build.conf, build/container/build-php-common.sh).
REBUILD_PHP_COMMON=1
# PHP 7.1 upstream supports libzip >= 0.11 and the legacy libtidy, both in jessie;
# Sury's minimums reflect newer distributions only.
CONTROL_SED="s/libzip-dev (>= 1.0.0)/libzip-dev/; s/libtidy-dev (>= 1:5.2.0)/libtidy-dev/"
# gcc 4.9 (jessie) does not know -Wincompatible-pointer-types (added in gcc 5).
RULES_SED="s/ -Wno-error=incompatible-pointer-types//"
# Sury's DNS telemetry patch (telemetry.sury.org) needs libsodium >= 1.0.12 (jessie
# has 1.0.0) and is not wanted in our rebuilds anyway: leave it out of the series.
DROP_PATCHES="0177-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch"
SOURCE_PACKAGE=php7.1
SOURCE_VERSION=7.1.33-81+0~20261022.128+debian12~1.gbpa88ccf
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php7.1
SOURCE_DSC_SHA256=6a4b405f9d3ea4610278c35a841a8e97842f1ec4d38452e5ce5fbbef2cfd1ed9
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above Sury's last jessie builds (7.1.33-N+0~...+debian8~1.gbp...).
NEW_VERSION="7.1.33-81+0~20261022.128+debian8~1+animaa2"
SURY_SOURCE_PACKAGE=php7.1
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php7.1 7.1.33-81 for Debian 8 jessie (includes the fix for CVE-2026-109618 and CVE-2026-109619; libzip/libtidy build-deps relaxed to jessie versions; php-common rebuilt from deb.sury.org php-defaults without its Breaks on PECL packages)."
# Packages installed by tests/install (no stock php7.1 on jessie: negative case is skipped)
TEST_PACKAGES="php7.1-cli php7.1-fpm"
# Stand-ins for extension packages a server has from Sury's old repository (versions
# in its style): below the limits in Sury's php-common Breaks, they must survive the upgrade.
TEST_DUMMY_PACKAGES="php-apcu=5.1.8+4.0.11-1+0~20161114.8+debian8~1 php-imagick=3.4.3-1+0~20170102.3+debian8~1"
TEST_PHP_BINARY=php7.1
