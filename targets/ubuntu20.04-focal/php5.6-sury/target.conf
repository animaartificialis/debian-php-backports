# Target: PHP 5.6 for Ubuntu 20.04 focal (sourced by bash)
#
# Focal never shipped PHP 5.6; it came from the ondrej/php PPA, which dropped focal
# when its standard support ended (last build 5.6.40-81, 2024-12).
# Source is Ondřej Surý's complete php5.6 source package (it contains the
# CVE-2026-109618/109619 fix as debian/patches/0261-...), rebuilt on focal.
DEBIAN_CODENAME=focal
DEBIAN_VERSION=20.04
BASE_IMAGE=docker.io/library/ubuntu:20.04
# Architectures to build, natively on a runner of each (the base image is multi-arch).
ARCHES="amd64 arm64"
APT_MIRROR=http://archive.ubuntu.com/ubuntu
# focal-updates instead of focal-security: Ubuntu publishes security fixes to -updates
# too, and the ubuntu:20.04 image already carries -updates versions that the
# security pocket alone cannot satisfy build dependencies against.
APT_SECURITY_MIRROR=http://archive.ubuntu.com/ubuntu
APT_SECURITY_SUITE=focal-updates
APT_COMPONENTS="main universe"
APT_MIRROR_arm64=http://ports.ubuntu.com/ubuntu-ports
APT_SECURITY_MIRROR_arm64=http://ports.ubuntu.com/ubuntu-ports
# php5.6-common needs a newer php-common than focal's 2:75: ship Sury's.
EXTRA_DEB_URLS="https://packages.sury.org/php/pool/main/p/php-defaults/php-common_101%2B0~20261021.78%2Bdebian11~1.gbp53f25f_all.deb"
# Sury's DNS telemetry patch is not wanted in our rebuilds.
DROP_PATCHES="0251-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch"
SOURCE_PACKAGE=php5.6
SOURCE_VERSION=5.6.40-104+0~20261021.134+debian12~1.gbp7401dd
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php5.6
SOURCE_DSC_SHA256=6bfab76939973d2bc8baa8144ac497e61c51c5c815db1860c64af98b7a6e6d78
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above the PPA's last focal build 5.6.40-81+ubuntu20.04.1+deb.sury.org+1.
NEW_VERSION="5.6.40-104+0~20261021.134+ubuntu20.04~1+animaa1"
SURY_SOURCE_PACKAGE=php5.6
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php5.6 5.6.40-104 for Ubuntu 20.04 focal (includes the fix for CVE-2026-109618 and CVE-2026-109619)."
TEST_PACKAGES="php5.6-cli php5.6-fpm"
TEST_PHP_BINARY=php5.6
