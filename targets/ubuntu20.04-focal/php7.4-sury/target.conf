# Target: PHP 7.4 for Ubuntu 20.04 focal (sourced by bash)
#
# Focal shipped PHP 7.4.3; newer builds came from the ondrej/php PPA, which dropped
# focal when its standard support ended (last build 1:7.4.33-20, 2025-05).
# Source is Ondřej Surý's complete php7.4 source package (it contains the
# CVE-2026-109618/109619 fix as debian/patches/0164-...), rebuilt on focal.
DEBIAN_CODENAME=focal
DEBIAN_VERSION=20.04
BASE_IMAGE=docker.io/library/ubuntu:20.04
# Architectures to build, natively on a runner of each (the base image is multi-arch).
ARCHES="amd64 arm64"
APT_MIRROR=http://archive.ubuntu.com/ubuntu
# focal-updates instead of focal-security: Ubuntu publishes security fixes to -updates
# too, and the ubuntu:20.04 image already carries -updates versions that the
# security pocket alone cannot satisfy build dependencies against.
APT_SECURITY_MIRROR=http://archive.ubuntu.com/ubuntu
APT_SECURITY_SUITE=focal-updates
APT_COMPONENTS="main universe"
APT_MIRROR_arm64=http://ports.ubuntu.com/ubuntu-ports
APT_SECURITY_MIRROR_arm64=http://ports.ubuntu.com/ubuntu-ports
# php7.4-common needs a newer php-common than focal's 2:75: ship Sury's.
# Focal's own argon2 and PCRE2 (10.34) are recent enough.
EXTRA_DEB_URLS="https://packages.sury.org/php/pool/main/p/php-defaults/php-common_101%2B0~20261021.78%2Bdebian11~1.gbp53f25f_all.deb"
# Sury's DNS telemetry patch is not wanted in our rebuilds.
DROP_PATCHES="0128-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch"
SOURCE_PACKAGE=php7.4
SOURCE_VERSION=7.4.33-31+0~20261021.121+debian11~1.gbpe9c428
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php7.4
SOURCE_DSC_SHA256=6b7c27a939284fc6e21f8678cf2dcacdc3c90c341b365ab97168474d70a9c4ec
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above focal's 7.4.3-4ubuntuN and the PPA's last 1:7.4.33-20+ubuntu20.04.1+deb.sury.org+1.
NEW_VERSION="1:7.4.33-31+0~20261021.121+ubuntu20.04~1+animaa1"
SURY_SOURCE_PACKAGE=php7.4
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php7.4 7.4.33-31 for Ubuntu 20.04 focal (includes the fix for CVE-2026-109618 and CVE-2026-109619)."
TEST_PACKAGES="php7.4-cli php7.4-fpm"
TEST_PHP_BINARY=php7.4
