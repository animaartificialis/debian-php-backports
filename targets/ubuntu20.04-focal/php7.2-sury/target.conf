# Target: PHP 7.2 for Ubuntu 20.04 focal (sourced by bash)
#
# Focal never shipped PHP 7.2 (its own PHP is 7.4); it came from the ondrej/php PPA,
# which dropped focal when its standard support ended (last build 7.2.34-54, 2024-12).
# Source is Ondřej Surý's complete php7.2 source package (it contains the
# CVE-2026-109618/109619 fix as debian/patches/0159-...), rebuilt on focal.
DEBIAN_CODENAME=focal
DEBIAN_VERSION=20.04
BASE_IMAGE=docker.io/library/ubuntu:20.04
# Architectures to build, natively on a runner of each (the base image is multi-arch).
ARCHES="amd64 arm64"
APT_MIRROR=http://archive.ubuntu.com/ubuntu
# focal-updates instead of focal-security: Ubuntu publishes security fixes to -updates
# too, and the ubuntu:20.04 image already carries -updates versions that the
# security pocket alone cannot satisfy build dependencies against.
APT_SECURITY_MIRROR=http://archive.ubuntu.com/ubuntu
APT_SECURITY_SUITE=focal-updates
APT_COMPONENTS="main universe"
APT_MIRROR_arm64=http://ports.ubuntu.com/ubuntu-ports
APT_SECURITY_MIRROR_arm64=http://ports.ubuntu.com/ubuntu-ports
# php7.2-common depends on php-common (>= 1:81~) and Sury's other php7.2 packages on
# php-common (>= 2:69~) at most, which focal's own 2:75 satisfies. The focal php5.6 and
# php7.4 targets ship a php-common rebuilt from Sury's php-defaults source (see there),
# so the focal sury component carries it and apt upgrades 2:75 to it anyway. Ship it here
# too, so the tarball and the component agree (pins in build/build.conf).
REBUILD_PHP_COMMON=1
# Focal's own argon2 is recent enough; PHP 7.2 uses PCRE1.
# Sury's DNS telemetry patch is not wanted in our rebuilds.
DROP_PATCHES="0144-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch"
SOURCE_PACKAGE=php7.2
SOURCE_VERSION=7.2.34-66+0~20261021.122+debian11~1.gbpe0bcd4
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php7.2
SOURCE_DSC_SHA256=f531f0169cc7ec48ce0524cb1065b4b451eb98eed717350e34c8dc6cddb59d51
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above the PPA's last focal build 7.2.34-54+ubuntu20.04.1+deb.sury.org+1.
NEW_VERSION="7.2.34-66+0~20261021.122+ubuntu20.04~1+animaa2"
SURY_SOURCE_PACKAGE=php7.2
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php7.2 7.2.34-66 for Ubuntu 20.04 focal (includes the fix for CVE-2026-109618 and CVE-2026-109619; php-common rebuilt from deb.sury.org php-defaults without its Breaks on PECL packages)."
TEST_PACKAGES="php7.2-cli php7.2-fpm"
# Stand-ins for focal's own extension packages: below the limits in Sury's php-common
# Breaks, they must survive the upgrade.
TEST_DUMMY_PACKAGES="php-apcu=5.1.18+4.0.11-1build1 php-imagick=3.4.4-4"
TEST_PHP_BINARY=php7.2
