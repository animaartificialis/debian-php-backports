# Target: Debian 7 wheezy, php5 5.4.45, compat variant (sourced by bash)
#
# The same build as debian7-wheezy/php5.4-debian without its six larger fixes, for
# applications that break on their behaviour changes (see the README and the base
# target's patches/SOURCE.md). It has no patches of its own: build/build.sh applies the
# base target's patches/series without the patches in EXCLUDE_BASE_PATCHES. Everything
# not set below comes from the base target.conf.
BASE_TARGET=debian7-wheezy/php5.4-debian
# shellcheck source=/dev/null
source "$(dirname "${BASH_SOURCE[0]}")/../../$BASE_TARGET/target.conf"
EXCLUDE_BASE_PATCHES="
    CVE-2019-9675-php54.patch
    CVE-2024-8929-php54.patch
    CVE-2025-1218-php54.patch
    CVE-2025-1736-php54.patch
    0294-Fix-GHSA-fpwc-w8rq-cr92-strip-credentials-from-user-hea-php54.patch
    CVE-2025-1861-php54.patch
"
# Sorts below the base target's version ("~"), so that switching to this variant is a
# downgrade and switching back an upgrade (see the README), and above the base target's
# earlier versions (5.4.45-0+deb7u30+animaa3 and +animaa3+ext1).
NEW_VERSION="${NEW_VERSION}~compat1"
CHANGELOG_ENTRY="${CHANGELOG_ENTRY% "$CHANGELOG_ENTRY_LARGER_FIXES"} Compat variant: without the larger backports of the default build, which change behaviour."
