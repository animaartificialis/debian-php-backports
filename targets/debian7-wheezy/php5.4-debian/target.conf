# Target: Debian 7 wheezy, official php5 5.4.45 (sourced by bash)
#
# Sury never shipped PHP 5.4, so there is no Sury patch for it. The patch in
# patches/ is Sury's php5.6 patch 0261 ported to 5.4 (see its header and SOURCE.md).
# It is NOT fetched by build/fetch-sury-patches.sh: do not run that for wheezy.
DEBIAN_CODENAME=wheezy
DEBIAN_VERSION=7
BASE_IMAGE=docker.io/library/debian:wheezy-slim
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian-security
APT_SECURITY_SUITE=wheezy/updates
# wheezy's archive keys are expired
APT_SOURCE_OPTIONS="[trusted=yes]"
SOURCE_PACKAGE=php5
SOURCE_VERSION=5.4.45-0+deb7u14
SOURCE_POOL_URL=http://archive.debian.org/debian-security/pool/updates/main/p/php5
SOURCE_DSC_SHA256=66bce0fb996ae406da97a1e269a4178b32c7c7594f69f7cb8c90f14ca660a61f
SURY_SOURCE_PACKAGE=php5.6
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Fix CVE-2026-109618 and CVE-2026-109619 (Avoid state corruption via bailout): deb.sury.org php5.6 5.6.40-104 patch ported to PHP 5.4."
TEST_PACKAGES="php5-cli php5-fpm"
TEST_PHP_BINARY=php5
