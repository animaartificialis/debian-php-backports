# Target: Debian 7 wheezy, php5 5.4.45 (sourced by bash)
#
# The source is the last Freexian ELTS update of wheezy's php5 (deb7u30, May 2020),
# which has the ELTS fixes from deb7u15 to deb7u30 on top of Debian LTS's last update
# (deb7u14). Sury never shipped PHP 5.4, so there is no Sury patch for it. The patches
# in patches/ are Sury's php5.6 patches and Freexian ELTS's jessie php5 (5.6) patches
# ported to 5.4 (see their headers and SOURCE.md).
# They are NOT fetched by build/fetch-sury-patches.sh: do not run that for wheezy.
DEBIAN_CODENAME=wheezy
DEBIAN_VERSION=7
BASE_IMAGE=docker.io/library/debian:wheezy-slim
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian-security
APT_SECURITY_SUITE=wheezy/updates
# wheezy's archive keys are expired
APT_SOURCE_OPTIONS="[trusted=yes]"
SOURCE_PACKAGE=php5
# Freexian's public ELTS repository; same orig tarball and Build-Depends as Debian's deb7u14
SOURCE_VERSION=5.4.45-0+deb7u30
SOURCE_POOL_URL=http://deb.freexian.com/extended-lts/pool/main/p/php5
SOURCE_DSC_SHA256=31731d1836e333fa2ac029e0ad5c51acb04b67be53c150bd11b4833ece60240d
SURY_SOURCE_PACKAGE=php5.6
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
# Must sort above the earlier builds here (5.4.45-0+deb7u30+animaa3, and the extended
# variant 5.4.45-0+deb7u30+animaa3+ext1 that v2026.11.23 shipped) and above ELTS's own
# 5.4.45-0+deb7u30, so that apt picks this build when both are enabled.
NEW_VERSION="5.4.45-0+deb7u30+animaa4"
CHANGELOG_ENTRY="Security fixes added to Freexian ELTS php5 5.4.45-0+deb7u30, ported to PHP 5.4 from Freexian ELTS php5 5.6.40+dfsg-0+deb8u23 (most of the 2020 to 2024 fixes) and from deb.sury.org php5.6 5.6.40-105 and 5.6.40-109 (the others). dns_get_record(): GHSA-www2-q4fc-65wf. Cookies and request variables: CVE-2022-31629, CVE-2024-2756 and CVE-2020-7070. convert.* filters: CVE-2024-11233 and CVE-2026-92842. getimagesize(): CVE-2025-14177. SOAP: CVE-2026-6722, CVE-2026-91765, CVE-2026-15353, CVE-2021-21702, CVE-2026-129506, CVE-2025-14181, CVE-2026-7262, CVE-2025-6491, CVE-2023-3247 and CVE-2026-7261. OpenSSL: GH-22187. Path resolution: CVE-2023-0568. File uploads: CVE-2023-0662 and CVE-2024-8925. HTTP stream wrapper: CVE-2024-11234 and CVE-2026-128064. Other PDO drivers: CVE-2024-11236 (firebird, dblib), CVE-2022-31631 (sqlite) and CVE-2021-21704 (firebird). Sessions: CVE-2026-126714 and CVE-2026-115560. XML: CVE-2021-21707 and CVE-2023-3823. Timezone cache: CVE-2026-129496. NUL bytes in host names: CVE-2025-1220. CLI server: GHSA-4w77-75f9-2c8w. pgsql and pdo_pgsql: CVE-2025-1735, CVE-2026-17543 and CVE-2022-31625. FILTER_SANITIZE_ENCODED: GHSA-ch8v-r6jh-4vvr. State corruption via bailout: CVE-2026-109618 and CVE-2026-109619. FILTER_VALIDATE_URL: CVE-2020-7071, CVE-2024-5458 and CVE-2021-21705. FPM: CVE-2026-6735, CVE-2026-129292, CVE-2026-129291 and CVE-2026-129289 (the FastCGI part; PHP 5.4 does not have the bug itself). crypt(): CVE-2023-0567. php-cgi: CVE-2024-8927 and CVE-2026-129538. Phar: CVE-2020-7068, CVE-2026-7260, CVE-2026-6103, CVE-2026-128090, CVE-2022-31628 and CVE-2023-3824. mysqlnd: CVE-2022-31626."
# The six larger fixes (the last six patches in patches/series). Kept apart because the
# -compat variant leaves these patches out and must leave them out of its entry too.
CHANGELOG_ENTRY_LARGER_FIXES="Larger backports: Phar: CVE-2019-9675. mysqlnd: CVE-2024-8929 and CVE-2025-1218. HTTP stream wrapper: CVE-2025-1736, CVE-2026-91766 and CVE-2025-1861."
CHANGELOG_ENTRY="${CHANGELOG_ENTRY} ${CHANGELOG_ENTRY_LARGER_FIXES}"
TEST_PACKAGES="php5-cli php5-fpm"
TEST_PHP_BINARY=php5
