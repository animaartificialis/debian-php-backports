# Target: Debian 7 wheezy, php5 5.4.45, extended variant (sourced by bash)
#
# The same build as debian7-wheezy/php5.4-debian plus some larger security backports
# that the normal target does not carry (see patches/SOURCE.md). build/build.sh applies
# the base target's patches/series first and then the one in patches/ here, so the base
# patches are not copied. Everything not set below comes from the base target.conf.
BASE_TARGET=debian7-wheezy/php5.4-debian
# shellcheck source=/dev/null
source "$(dirname "${BASH_SOURCE[0]}")/../../$BASE_TARGET/target.conf"
# Sorts above the normal target's version, so that switching to this variant is an
# upgrade (and switching back a downgrade, see the README).
NEW_VERSION="${NEW_VERSION}+ext1"
CHANGELOG_ENTRY="${CHANGELOG_ENTRY} Extended variant, with larger backports: Phar: CVE-2019-9675. mysqlnd: CVE-2024-8929 and CVE-2025-1218. HTTP stream wrapper: CVE-2025-1736 and CVE-2026-91766."
