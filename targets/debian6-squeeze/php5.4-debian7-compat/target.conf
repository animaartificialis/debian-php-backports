# Target: PHP 5.4 for Debian 6 squeeze, compat variant (sourced by bash)
#
# The same build as debian6-squeeze/php5.4-debian7 without its six larger fixes, for
# applications that break on their behaviour changes (see the README and the base
# target's patches/SOURCE.md). It has no patches of its own: build/build.sh applies the
# base target's patches/series without the patches in EXCLUDE_BASE_PATCHES (the same
# list as in debian7-wheezy/php5.4-debian-compat). Everything not set below comes from
# the base target.conf.
BASE_TARGET=debian6-squeeze/php5.4-debian7
# shellcheck source=/dev/null
source "$(dirname "${BASH_SOURCE[0]}")/../../$BASE_TARGET/target.conf"
EXCLUDE_BASE_PATCHES="
    CVE-2019-9675-php54.patch
    CVE-2024-8929-php54.patch
    CVE-2025-1218-php54.patch
    CVE-2025-1736-php54.patch
    0294-Fix-GHSA-fpwc-w8rq-cr92-strip-credentials-from-user-hea-php54.patch
    CVE-2025-1861-php54.patch
"
# Sorts below the base target's version (5.4.45-1+animaaN~squeeze), so that switching to
# this variant is a downgrade and switching back an upgrade (see the README), and above
# the base target's earlier versions (5.4.45-1+animaa5~squeeze and +animaa5+ext1~squeeze).
NEW_VERSION="${NEW_VERSION%~squeeze}~compat1~squeeze"
CHANGELOG_ENTRY="${CHANGELOG_ENTRY% "$CHANGELOG_ENTRY_LARGER_FIXES"} Compat variant: without the larger backports of the default build, which change behaviour."
