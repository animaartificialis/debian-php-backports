# Target: PHP 5.4 for Debian 6 squeeze, extended variant (sourced by bash)
#
# The same build as debian6-squeeze/php5.4-debian7 plus some larger security backports
# that the normal target does not carry (see patches/SOURCE.md; the patches are the
# same files as in targets/debian7-wheezy/php5.4-debian-extended/patches/). build/build.sh
# applies the base target's patches/series first and then the one in patches/ here, so
# the base patches are not copied. Everything not set below comes from the base target.conf.
BASE_TARGET=debian6-squeeze/php5.4-debian7
# shellcheck source=/dev/null
source "$(dirname "${BASH_SOURCE[0]}")/../../$BASE_TARGET/target.conf"
# Sorts above the normal target's version (5.4.45-1+animaaN~squeeze), so that switching
# to this variant is an upgrade (and switching back a downgrade, see the README).
NEW_VERSION="${NEW_VERSION%~squeeze}+ext1~squeeze"
CHANGELOG_ENTRY="${CHANGELOG_ENTRY} Extended variant, with larger backports:"
