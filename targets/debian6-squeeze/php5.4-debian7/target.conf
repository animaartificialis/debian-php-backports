# Target: PHP 5.4 for Debian 6 squeeze (sourced by bash)
#
# Squeeze shipped PHP 5.3 only; 5.4 typically came from dotdeb.org. Neither Sury
# nor Debian ever had 5.4 for squeeze, so the source is wheezy's official
# php5 5.4.45-0+deb7u14 with the same 5.4 port of Sury's patch as the wheezy target
# (patches/ is a copy of build/targets/wheezy/patches/), built on squeeze.
DEBIAN_CODENAME=squeeze
DEBIAN_VERSION=6
BASE_IMAGE=docker.io/debian/eol:squeeze
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian
APT_SECURITY_SUITE=squeeze-lts
# apt 0.8.10 has no [trusted=yes]; archive keys are expired
APT_EXTRA_CONF='APT::Get::AllowUnauthenticated "true";'
# squeeze dpkg 1.15 segfaults on "dpkg --search" in the container (dpkg-shlibdeps needs it)
DPKG_SEARCH_WRAPPER=1
SOURCE_PACKAGE=php5
SOURCE_VERSION=5.4.45-0+deb7u14
SOURCE_POOL_URL=http://archive.debian.org/debian-security/pool/updates/main/p/php5
SOURCE_DSC_SHA256=66bce0fb996ae406da97a1e269a4178b32c7c7594f69f7cb8c90f14ca660a61f
# wheezy packaging pre-depends on dpkg >= 1.16.1 only for "interest-noawait"
# triggers; squeeze has dpkg 1.15.12, which supports plain "interest" triggers and
# dpkg-maintscript-helper mv_conffile (>= 1.15.7.2) used by the maintainer scripts.
# psmisc >= 22.15 is wanted only for fuser in the session cleanup cron; squeeze has 22.11.
CONTROL_SED="s/dpkg (>= 1.16.1~)/dpkg (>= 1.15.7.2)/g; s/psmisc (>= 22.15-1~)/psmisc/g"
SOURCE_FIXUP_CMD="sed -i -E 's/^(interest|activate)-noawait /\\1 /' debian/*.triggers"
# php5 5.4 is not in squeeze: build dependencies come from the wheezy dsc
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above squeeze's 5.3 and dotdeb's 5.4.45-1~dotdeb+6.1 ("+" > "~").
NEW_VERSION="5.4.45-1+animaa2~squeeze"
SURY_SOURCE_PACKAGE=php5.6
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Build of wheezy php5 5.4.45-0+deb7u14 for squeeze with the fixes for CVE-2026-109618 and CVE-2026-109619 (Avoid state corruption via bailout) and CVE-2023-0662 (max_multipart_body_parts), ported from deb.sury.org php5.6 5.6.40-105."
# squeeze has no php5-fpm (added in wheezy)
TEST_PACKAGES="php5-cli php5-cgi"
TEST_PHP_BINARY=php5
