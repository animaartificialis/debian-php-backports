# Target: PHP 5.4 for Debian 6 squeeze (sourced by bash)
#
# Squeeze shipped PHP 5.3 only; 5.4 typically came from dotdeb.org. Neither Sury
# nor Debian ever had 5.4 for squeeze, so the source is wheezy's php5 5.4.45-0+deb7u30
# (the last Freexian ELTS update for wheezy) with the same 5.4 ports of Sury's and
# ELTS's patches as the wheezy target (patches/ is a copy of targets/debian7-wheezy/php5.4-debian/patches/),
# built on squeeze.
DEBIAN_CODENAME=squeeze
DEBIAN_VERSION=6
BASE_IMAGE=docker.io/debian/eol:squeeze
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian
APT_SECURITY_SUITE=squeeze-lts
# apt 0.8.10 has no [trusted=yes]; archive keys are expired
APT_EXTRA_CONF='APT::Get::AllowUnauthenticated "true";'
# squeeze dpkg 1.15 segfaults on "dpkg --search" in the container (dpkg-shlibdeps needs it)
DPKG_SEARCH_WRAPPER=1
SOURCE_PACKAGE=php5
SOURCE_VERSION=5.4.45-0+deb7u30
SOURCE_POOL_URL=http://deb.freexian.com/extended-lts/pool/main/p/php5
SOURCE_DSC_SHA256=31731d1836e333fa2ac029e0ad5c51acb04b67be53c150bd11b4833ece60240d
# wheezy packaging pre-depends on dpkg >= 1.16.1 only for "interest-noawait"
# triggers; squeeze has dpkg 1.15.12, which supports plain "interest" triggers and
# dpkg-maintscript-helper mv_conffile (>= 1.15.7.2) used by the maintainer scripts.
# psmisc >= 22.15 is wanted only for fuser in the session cleanup cron; squeeze has 22.11.
CONTROL_SED="s/dpkg (>= 1.16.1~)/dpkg (>= 1.15.7.2)/g; s/psmisc (>= 22.15-1~)/psmisc/g"
SOURCE_FIXUP_CMD="sed -i -E 's/^(interest|activate)-noawait /\\1 /' debian/*.triggers"
# php5 5.4 is not in squeeze: build dependencies come from the wheezy dsc
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above squeeze's 5.3, dotdeb's 5.4.45-1~dotdeb+6.1 ("+" > "~") and the
# earlier builds here (5.4.45-1+animaa4~squeeze, built from deb7u30).
NEW_VERSION="5.4.45-1+animaa5~squeeze"
SURY_SOURCE_PACKAGE=php5.6
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Security fixes added to a build of wheezy php5 5.4.45-0+deb7u30 (Freexian ELTS) for squeeze, ported to PHP 5.4 from Freexian ELTS php5 5.6.40+dfsg-0+deb8u23 (most of the 2020 to 2024 fixes) and from deb.sury.org php5.6 5.6.40-105 and 5.6.40-109 (the others). dns_get_record(): GHSA-www2-q4fc-65wf. Cookies and request variables: CVE-2022-31629, CVE-2024-2756 and CVE-2020-7070. convert.* filters: CVE-2024-11233 and CVE-2026-92842. getimagesize(): CVE-2025-14177. SOAP: CVE-2026-6722, CVE-2026-91765, CVE-2026-15353, CVE-2021-21702, CVE-2026-129506, CVE-2025-14181, CVE-2026-7262, CVE-2025-6491, CVE-2023-3247 and CVE-2026-7261. OpenSSL: GH-22187. Path resolution: CVE-2023-0568. File uploads: CVE-2023-0662 and CVE-2024-8925. HTTP stream wrapper: CVE-2024-11234 and CVE-2026-128064. Other PDO drivers: CVE-2024-11236 (firebird, dblib), CVE-2022-31631 (sqlite) and CVE-2021-21704 (firebird). Sessions: CVE-2026-126714 and CVE-2026-115560. XML: CVE-2021-21707 and CVE-2023-3823. Timezone cache: CVE-2026-129496. NUL bytes in host names: CVE-2025-1220. CLI server: GHSA-4w77-75f9-2c8w. pgsql and pdo_pgsql: CVE-2025-1735, CVE-2026-17543 and CVE-2022-31625. FILTER_SANITIZE_ENCODED: GHSA-ch8v-r6jh-4vvr. State corruption via bailout: CVE-2026-109618 and CVE-2026-109619. FILTER_VALIDATE_URL: CVE-2020-7071, CVE-2024-5458 and CVE-2021-21705. FPM: CVE-2026-6735, CVE-2026-129292, CVE-2026-129291 and CVE-2026-129289 (the FastCGI part; PHP 5.4 does not have the bug itself). crypt(): CVE-2023-0567. php-cgi: CVE-2024-8927 and CVE-2026-129538. Phar: CVE-2020-7068, CVE-2026-7260, CVE-2026-6103, CVE-2026-128090, CVE-2022-31628 and CVE-2023-3824. mysqlnd: CVE-2022-31626."
# squeeze has no php5-fpm (added in wheezy)
TEST_PACKAGES="php5-cli php5-cgi"
TEST_PHP_BINARY=php5
