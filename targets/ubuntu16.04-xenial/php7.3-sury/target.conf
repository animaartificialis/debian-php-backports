# Target: PHP 7.3 for Ubuntu 16.04 xenial (sourced by bash)
#
# Xenial shipped PHP 7.0; PHP 7.3 came from the ondrej/php PPA, which dropped xenial
# in 2021 (last build 7.3.28-1). Source is Ondřej Surý's complete php7.3 source
# package (it contains the CVE-2026-109618/109619 fix as debian/patches/0139-...),
# rebuilt on xenial.
DEBIAN_CODENAME=xenial
DEBIAN_VERSION=16.04
BASE_IMAGE=docker.io/library/ubuntu:16.04
APT_MIRROR=http://archive.ubuntu.com/ubuntu
# xenial-updates instead of xenial-security: Ubuntu publishes security fixes to -updates
# too, and the ubuntu:16.04 image already carries -updates versions.
APT_SECURITY_MIRROR=http://archive.ubuntu.com/ubuntu
APT_SECURITY_SUITE=xenial-updates
APT_COMPONENTS="main universe"
# Sury's packaging needs debhelper >= 9.20160709; xenial has 9.20160115, backports has 10.
APT_BACKPORTS_SUITE=xenial-backports
BACKPORTS_PACKAGES="debhelper dh-autoreconf"
# php7.3 needs php-common (>= 1:81~) to build and to run; xenial has 1:35ubuntu6. Sury's binary
# php-common breaks older PECL extension packages (php-apcu, php-imagick, php-redis, ...:
# limits meant for PHP 8), so apt would remove working extensions with the upgrade. It is
# rebuilt from his php-defaults source without that field and ships with the packages
# (pins in build/build.conf, build/container/build-php-common.sh).
REBUILD_PHP_COMMON=1
# Extra .deb files installed for the build; the libraries also ship with the packages:
# - bionic's libargon2-0 (xenial has no argon2 at all),
# - bionic's libpcre2 10.31 (PHP 7.3 needs >= 10.30, xenial has 10.21); the system
#   library, not PHP's bundled copy, for the reason given in debian9-stretch/php7.3-sury,
# - bionic's libtidy5 5.2.0 (Sury needs >= 5.2.0, xenial has the 2009 libtidy-0.99).
# All of these depend only on glibc >= 2.14 (xenial has 2.23). Libraries before -dev packages.
BIONIC_POOL=http://archive.ubuntu.com/ubuntu/pool
EXTRA_DEB_URLS="${BIONIC_POOL}/main/a/argon2/libargon2-0_0~20161029-1.1_amd64.deb
 ${BIONIC_POOL}/main/a/argon2/libargon2-0-dev_0~20161029-1.1_amd64.deb
 ${BIONIC_POOL}/universe/p/pcre2/libpcre2-8-0_10.31-2_amd64.deb
 ${BIONIC_POOL}/universe/p/pcre2/libpcre2-16-0_10.31-2_amd64.deb
 ${BIONIC_POOL}/universe/p/pcre2/libpcre2-32-0_10.31-2_amd64.deb
 ${BIONIC_POOL}/universe/p/pcre2/libpcre2-posix0_10.31-2_amd64.deb
 ${BIONIC_POOL}/universe/p/pcre2/libpcre2-dev_10.31-2_amd64.deb
 ${BIONIC_POOL}/main/t/tidy-html5/libtidy5_5.2.0-2_amd64.deb
 ${BIONIC_POOL}/main/t/tidy-html5/libtidy-dev_5.2.0-2_amd64.deb"
# EXTRA_DEB_BUILD_ONLY: installed for the build, not shipped. libpcre2-dev ships, as
# php7.3-dev depends on libpcre2-dev (>= 10.30). Targets of the same release share the
# apt pool (repo/build-apt-repo.sh copies with cp -n): they must mark the same names.
EXTRA_DEB_BUILD_ONLY="libargon2-0-dev libtidy-dev"
# Sury's DNS telemetry patch is not wanted in our rebuilds.
DROP_PATCHES="0126-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch"
SOURCE_PACKAGE=php7.3
SOURCE_VERSION=7.3.33-35+0~20261021.144+debian11~1.gbpecf76f
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php7.3
SOURCE_DSC_SHA256=93994bcd4b966ed4faa4e668dc6475beee00c1ef5494f1011a21fc6b10a86df9
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above the PPA's last xenial build 7.3.28-1+ubuntu16.04.1+deb.sury.org+1.
NEW_VERSION="7.3.33-35+0~20261021.144+ubuntu16.04~1+animaa2"
SURY_SOURCE_PACKAGE=php7.3
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php7.3 7.3.33-35 for Ubuntu 16.04 xenial (includes the fix for CVE-2026-109618 and CVE-2026-109619; system PCRE2 10.31, argon2 and tidy 5.2 from bionic; php-common rebuilt from deb.sury.org php-defaults without its Breaks on PECL packages)."
TEST_PACKAGES="php7.3-cli php7.3-fpm"
# Stand-ins for extension packages a server has from Sury's old repository (versions
# in its style): below the limits in Sury's php-common Breaks, they must survive the upgrade.
TEST_DUMMY_PACKAGES="php-apcu=5.1.17+4.0.11-1+ubuntu16.04.1+deb.sury.org+1 php-imagick=3.4.4-1+ubuntu16.04.1+deb.sury.org+1"
TEST_PHP_BINARY=php7.3
