# Target: PHP 5.6 for Ubuntu 16.04 xenial (sourced by bash)
#
# Xenial shipped PHP 7.0; PHP 5.6 came from the ondrej/php PPA, which dropped xenial
# in 2021 (last build 5.6.40-50). Source is Ondřej Surý's complete php5.6 source
# package (it contains the CVE-2026-109618/109619 fix as debian/patches/0261-... and
# the CVE-2023-0662 backport), rebuilt on xenial.
DEBIAN_CODENAME=xenial
DEBIAN_VERSION=16.04
BASE_IMAGE=docker.io/library/ubuntu:16.04
APT_MIRROR=http://archive.ubuntu.com/ubuntu
# xenial-updates instead of xenial-security: Ubuntu publishes security fixes to -updates
# too, and the ubuntu:16.04 image already carries -updates versions.
APT_SECURITY_MIRROR=http://archive.ubuntu.com/ubuntu
APT_SECURITY_SUITE=xenial-updates
APT_COMPONENTS="main universe"
# Sury's packaging needs debhelper >= 9.20160709; xenial has 9.20160115, backports has 10.
APT_BACKPORTS_SUITE=xenial-backports
BACKPORTS_PACKAGES="debhelper dh-autoreconf"
# php5.6 needs php-common (>= 1:81~) to build and to run; xenial has 1:35ubuntu6. Sury's binary
# php-common breaks older PECL extension packages (php-apcu, php-imagick, php-redis, ...:
# limits meant for PHP 8), so apt would remove working extensions with the upgrade. It is
# rebuilt from his php-defaults source without that field and ships with the packages
# (pins in build/build.conf, build/container/build-php-common.sh).
REBUILD_PHP_COMMON=1
# Extra .deb files installed for the build; the libraries also ship with the packages:
# - bionic's libtidy5 5.2.0 (Sury needs >= 5.2.0, xenial has the 2009 libtidy-0.99).
# PHP 5.6 uses PCRE1 and has no argon2, so nothing else is needed. Both depend only
# on glibc >= 2.14 (xenial has 2.23). Libraries before -dev packages.
BIONIC_POOL=http://archive.ubuntu.com/ubuntu/pool
EXTRA_DEB_URLS="${BIONIC_POOL}/main/t/tidy-html5/libtidy5_5.2.0-2_amd64.deb
 ${BIONIC_POOL}/main/t/tidy-html5/libtidy-dev_5.2.0-2_amd64.deb"
# Installed for the build, not shipped. Targets of the same release share the apt pool
# (repo/build-apt-repo.sh copies with cp -n): they must mark the same names.
EXTRA_DEB_BUILD_ONLY="libtidy-dev"
# Sury's DNS telemetry patch (telemetry.sury.org) needs libsodium >= 1.0.12 (xenial has 1.0.8)
# and is not wanted in our rebuilds anyway.
DROP_PATCHES="0251-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch"
SOURCE_PACKAGE=php5.6
SOURCE_VERSION=5.6.40-105+0~20261022.135+debian12~1.gbp37a17e
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php5.6
SOURCE_DSC_SHA256=d68b4e2a9fa6427768ac043d25ac48f6bb72bcb26e66c8c99dece1b98d364de8
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above the PPA's last xenial build 5.6.40-50+ubuntu16.04.1+deb.sury.org+1.
NEW_VERSION="5.6.40-105+0~20261022.135+ubuntu16.04~1+animaa2"
SURY_SOURCE_PACKAGE=php5.6
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php5.6 5.6.40-105 for Ubuntu 16.04 xenial (includes the fixes for CVE-2026-109618, CVE-2026-109619 and CVE-2023-0662; tidy 5.2 from bionic; php-common rebuilt from deb.sury.org php-defaults without its Breaks on PECL packages)."
TEST_PACKAGES="php5.6-cli php5.6-fpm"
# Stand-ins for extension packages a server has from Sury's old repository (versions
# in its style): below the limits in Sury's php-common Breaks, they must survive the upgrade.
TEST_DUMMY_PACKAGES="php-apcu=5.1.17+4.0.11-1+ubuntu16.04.1+deb.sury.org+1 php-imagick=3.4.4-1+ubuntu16.04.1+deb.sury.org+1"
TEST_PHP_BINARY=php5.6
