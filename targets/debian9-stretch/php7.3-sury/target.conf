# Target: PHP 7.3 for Debian 9 stretch (sourced by bash)
#
# Stretch never shipped PHP 7.3; it came from deb.sury.org, which dropped stretch.
# Source is Ondřej Surý's complete php7.3 source package (it contains the
# CVE-2026-109618/109619 fix as debian/patches/0139-...), rebuilt on stretch.
DEBIAN_CODENAME=stretch
DEBIAN_VERSION=9
BASE_IMAGE=docker.io/library/debian:stretch-slim
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian-security
APT_SECURITY_SUITE=stretch/updates
# php7.3 needs php-common (>= 1:81~) to build and to run; stretch has 1:49. Sury's binary
# php-common breaks older PECL extension packages (php-apcu, php-imagick, php-redis, ...:
# limits meant for PHP 8), so apt would remove working extensions with the upgrade. It is
# rebuilt from his php-defaults source without that field and ships with the packages
# (pins in build/build.conf, build/container/build-php-common.sh).
REBUILD_PHP_COMMON=1
# Extra .deb files installed for the build and shipped with the packages:
# - buster's libargon2-1 (PHP 7.3 needs >= 20161029, stretch has 20160821),
# - buster's libpcre2 10.32 (PHP 7.3 needs >= 10.30, stretch has 10.22). It must be
#   the system library, not PHP's bundled copy: bundled PCRE2 prefixes its symbols
#   with php_, which breaks existing third-party extensions compiled against Sury's
#   stretch PHP (e.g. apcu.so: "undefined symbol: pcre2_match_8"). Sury's stretch
#   repository shipped a newer libpcre2 too.
# All of these depend only on glibc. Order matters: libraries before -dev packages.
BUSTER_POOL=http://archive.debian.org/debian/pool/main
EXTRA_DEB_URLS="${BUSTER_POOL}/a/argon2/libargon2-1_0~20171227-0.2_amd64.deb
 ${BUSTER_POOL}/a/argon2/libargon2-dev_0~20171227-0.2_amd64.deb
 ${BUSTER_POOL}/p/pcre2/libpcre2-8-0_10.32-5_amd64.deb
 ${BUSTER_POOL}/p/pcre2/libpcre2-16-0_10.32-5_amd64.deb
 ${BUSTER_POOL}/p/pcre2/libpcre2-32-0_10.32-5_amd64.deb
 ${BUSTER_POOL}/p/pcre2/libpcre2-posix0_10.32-5_amd64.deb
 ${BUSTER_POOL}/p/pcre2/libpcre2-dev_10.32-5_amd64.deb"
# Sury's DNS telemetry patch (telemetry.sury.org) needs libsodium >= 1.0.12 (stretch
# has 1.0.11) and is not wanted in our rebuilds anyway: leave it out of the series.
DROP_PATCHES="0126-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch"
SOURCE_PACKAGE=php7.3
SOURCE_VERSION=7.3.33-35+0~20261021.144+debian11~1.gbpecf76f
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php7.3
SOURCE_DSC_SHA256=93994bcd4b966ed4faa4e668dc6475beee00c1ef5494f1011a21fc6b10a86df9
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above Sury's last stretch builds (7.3.N-M+0~...+debian9~1.gbp...).
# Built against the system PCRE2, not the bundled copy: the bundled one breaks third-party extensions.
NEW_VERSION="7.3.33-35+0~20261021.144+debian9~1+animaa2"
SURY_SOURCE_PACKAGE=php7.3
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php7.3 7.3.33-35 for Debian 9 stretch (includes the fix for CVE-2026-109618 and CVE-2026-109619; system PCRE2 10.32 from buster; php-common rebuilt from deb.sury.org php-defaults without its Breaks on PECL packages)."
# Packages installed by tests/install (no stock php7.3 on stretch: negative case is skipped)
TEST_PACKAGES="php7.3-cli php7.3-fpm"
# Stand-ins for extension packages a server has from Sury's old repository (versions
# in its style): below the limits in Sury's php-common Breaks, they must survive the upgrade.
TEST_DUMMY_PACKAGES="php-apcu=5.1.18+4.0.11-1+0~20191218.26+debian9~1 php-imagick=3.4.4-1+0~20190606.3+debian9~1"
TEST_PHP_BINARY=php7.3
