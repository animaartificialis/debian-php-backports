# Target: PHP 5.6 for Debian 9 stretch (sourced by bash)
#
# Stretch never shipped PHP 5.6; it came from deb.sury.org, which dropped stretch.
# Source is Ondřej Surý's complete php5.6 source package (it contains the
# CVE-2026-109618/109619 fix as debian/patches/0261-...), rebuilt on stretch.
DEBIAN_CODENAME=stretch
DEBIAN_VERSION=9
BASE_IMAGE=docker.io/library/debian:stretch-slim
APT_MIRROR=http://archive.debian.org/debian
APT_SECURITY_MIRROR=http://archive.debian.org/debian-security
APT_SECURITY_SUITE=stretch/updates
# php5.6 needs php-common (>= 1:81~) to build and to run; stretch has 1:49. Sury's binary
# php-common breaks older PECL extension packages (php-apcu, php-imagick, php-redis, ...:
# limits meant for PHP 8), so apt would remove working extensions with the upgrade. It is
# rebuilt from his php-defaults source without that field and ships with the packages
# (pins in build/build.conf, build/container/build-php-common.sh).
REBUILD_PHP_COMMON=1
# PHP 5.6 uses PCRE1 (stretch 8.39) and no argon2, so nothing else is shipped.
# Sury's DNS telemetry patch needs libsodium >= 1.0.12 (stretch has 1.0.11) and is
# not wanted in our rebuilds anyway.
DROP_PATCHES="0251-Add-minimal-privacy-preserving-secure-DNS-telemetry-.patch"
SOURCE_PACKAGE=php5.6
SOURCE_VERSION=5.6.40-105+0~20261022.135+debian12~1.gbp37a17e
SOURCE_POOL_URL=https://packages.sury.org/php/pool/main/p/php5.6
SOURCE_DSC_SHA256=d68b4e2a9fa6427768ac043d25ac48f6bb72bcb26e66c8c99dece1b98d364de8
BUILD_DEP_DSC_URL="${SOURCE_POOL_URL}/${SOURCE_PACKAGE}_${SOURCE_VERSION}.dsc"
# Must sort above Sury's last stretch builds (5.6.40-N+0~...+debian9~1.gbp...).
NEW_VERSION="5.6.40-105+0~20261022.135+debian9~1+animaa2"
SURY_SOURCE_PACKAGE=php5.6
SURY_DEBIAN_TAR_URL=""
SURY_DEBIAN_TAR_SHA256=""
SURY_PATCHES=""
CHANGELOG_ENTRY="Rebuild of deb.sury.org php5.6 5.6.40-105 for Debian 9 stretch (includes the fixes for CVE-2026-109618, CVE-2026-109619 and CVE-2023-0662; php-common rebuilt from deb.sury.org php-defaults without its Breaks on PECL packages)."
TEST_PACKAGES="php5.6-cli php5.6-fpm"
# Stand-ins for extension packages a server has from Sury's old repository (versions
# in its style): below the limits in Sury's php-common Breaks, they must survive the upgrade.
TEST_DUMMY_PACKAGES="php-apcu=5.1.18+4.0.11-1+0~20191218.26+debian9~1 php-imagick=3.4.4-1+0~20190606.3+debian9~1"
TEST_PHP_BINARY=php5.6
