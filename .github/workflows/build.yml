name: build

on:
  # Changes to documentation alone do not need a full build. Path filters are not used for
  # tags, so a release tag always builds.
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE', 'repo/index.html']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', 'repo/index.html']
  workflow_dispatch:

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      # One matrix entry per target and architecture (ARCHES in target.conf, default amd64),
      # each on a native runner.
      - id: list
        run: |
          echo "list=$(cd targets && find . -mindepth 2 -maxdepth 2 -type d -printf '%P\n' | sort -V \
            | while read -r t; do
                for a in $(ARCHES=amd64; source "$t/target.conf"; echo "$ARCHES"); do
                  jq -nc --arg t "$t" --arg a "$a" \
                    '{target: $t, arch: $a, runner: (if $a == "arm64" then "ubuntu-24.04-arm" else "ubuntu-24.04" end)}'
                done
              done | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    name: build (${{ matrix.target }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install podman
        run: command -v podman || { sudo apt-get update && sudo apt-get install -y podman; }
      - name: Build
        run: build/build.sh "${{ matrix.target }}" all
      - name: Install test
        run: make -C tests TEST_TARGETS="${{ matrix.target }}"
      - name: Artifact name and path
        id: name
        run: |
          echo "name=${TARGET//\//_}@$ARCH" >> "$GITHUB_OUTPUT"
          if [ "$ARCH" = amd64 ]; then echo "path=dist/$TARGET/"; else echo "path=dist-$ARCH/$TARGET/"; fi >> "$GITHUB_OUTPUT"
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ steps.name.outputs.path }}
          if-no-files-found: error

  publish:
    # Only tagged releases are published; branch builds just prove the targets build.
    # Targets that failed are left out instead of blocking the ones that passed.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Require at least one built target
        run: ls artifacts/*/ >/dev/null
      - name: Restore dist/<release>/<php> and dist-<arch>/<release>/<php> layout
        run: |
          for a in artifacts/*/; do
            n="$(basename "$a")"; arch="${n##*@}"; t="$(sed 's#_#/#' <<<"${n%@*}")"
            root=dist; [ "$arch" = amd64 ] || root="dist-$arch"
            mkdir -p "$root/$t" && cp -a "$a". "$root/$t/"
          done
      - name: Release tarballs
        run: |
          mkdir -p release
          for root in dist dist-*; do
            [ -d "$root" ] || continue
            suffix=""; [ "$root" = dist ] || suffix="_${root#dist-}"
            for d in "$root"/*/*/; do
              t="${d#"$root"/}"; t="${t%/}"
              tar -C "$root" -czf "release/${t//\//_}${suffix}.tar.gz" "$t"
            done
          done
          (cd release && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Release notes
        run: |
          {
            echo "| Target | Architecture | Source package | Version |"
            echo "|---|---|---|---|"
            for d in dist/*/*/ dist-*/*/*/; do
              [ -f "$d/BUILD-INFO.txt" ] || continue
              t="${d#*/}"; t="${t%/}"
              arch="$(sed -n 's/^architecture: *//p' "$d/BUILD-INFO.txt")"
              src="$(sed -n 's/^source package: *//p' "$d/BUILD-INFO.txt")"
              ver="$(sed -n 's/^new version: *//p' "$d/BUILD-INFO.txt")"
              echo "| \`$t\` | $arch | \`$src\` | \`$ver\` |"
            done
            echo
            echo "Install from the apt repository, or download a target tarball below and"
            echo "verify it against \`SHA256SUMS\`. See the README for details."
          } > release-notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md
      - name: Import signing key
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          [ -n "$REPO_SIGNING_KEY" ] || { echo "REPO_SIGNING_KEY secret is not set" >&2; exit 1; }
          echo "$REPO_SIGNING_KEY" | gpg --batch --import
      - name: Build apt repository
        run: |
          sudo apt-get install -y --no-install-recommends apt-utils
          repo/build-apt-repo.sh dist site 32E998308C448BF6CC57BD7BFEE348611F66C3D6
          cp repo/debian-php-backports.asc site/
          cp repo/index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
