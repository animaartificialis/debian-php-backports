# Global build defaults, sourced by build/build.sh.
# Suffix appended to the upstream version; sorts above the version it is built from.
VERSION_SUFFIX=+animaa1
# Changelog author
DEBFULLNAME="debian-php-backports"
DEBEMAIL="anima.artificialis@gmail.com"
# php-common for the sury targets that ask for it (REBUILD_PHP_COMMON=1 in target.conf;
# every release but buster): rebuilt in the builder image from Sury's php-defaults source
# of this version, pinned by the SHA256 of its .dsc, without the Breaks of php-common on
# older PECL extension packages (build/container/build-php-common.sh). Its version is
# Sury's own plus a suffix, the same on every release, so it sorts above the binary he
# built (which earlier releases here shipped) and above the last php-common of his old
# suites and PPA. Raise the suffix when php-common is rebuilt with a change.
PHP_COMMON_SOURCE_VERSION=101+0~20261021.78+debian11~1.gbp53f25f
PHP_COMMON_DSC_SHA256=1284e9d5fc91aaa44957a370f80e95761fef94506a9c88491351018bb6521ffc
PHP_COMMON_VERSION="2:${PHP_COMMON_SOURCE_VERSION}+animaa1"
# Passed to DEB_BUILD_OPTIONS; nocheck skips the (very long) upstream test suite
NPROC="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
DEB_BUILD_OPTIONS="nocheck parallel=${NPROC}"
