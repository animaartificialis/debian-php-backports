# Global build defaults, sourced by build/build.sh.
# Suffix appended to the upstream version; sorts above the version it is built from.
VERSION_SUFFIX=+animaa1
# Changelog author
DEBFULLNAME="debian-php-backports"
DEBEMAIL="anima.artificialis@gmail.com"
# Passed to DEB_BUILD_OPTIONS; nocheck skips the (very long) upstream test suite
NPROC="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
DEB_BUILD_OPTIONS="nocheck parallel=${NPROC}"
